<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroyAI</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body {
            background-color: #0f172a; 
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        
        /* Nowy przycisk Bluetooth */
        #ble-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-weight: bold;
            transition: 0.3s;
        }

        #orb {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #4285f4, #9b72cb, #ff8a65); 
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(155, 114, 203, 0.4);
            transition: all 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffffff;
            text-shadow: 0px 1px 4px rgba(0,0,0,0.4);
            margin-bottom: 25px;
        }

        #orb:active { transform: scale(0.95); }
        .listening { animation: organicPulse 3s infinite; background: linear-gradient(135deg, #ff758c, #ff7eb3, #9b72cb) !important; }
        .thinking { animation: organicPulse 2.5s infinite; background: linear-gradient(135deg, #00f2fe, #4facfe, #9b72cb) !important; }
        .speaking { animation: organicPulse 3.5s infinite; }

        @keyframes organicPulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(155, 114, 203, 0.4); }
            25% { transform: scale(1.06); box-shadow: 0 0 35px rgba(155, 114, 203, 0.7); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(155, 114, 203, 0.5); }
            75% { transform: scale(1.08); box-shadow: 0 0 40px rgba(155, 114, 203, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(155, 114, 203, 0.4); }
        }

        #chat-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            width: 85%;
            max-width: 500px;
            height: 120px;
            overflow-y: auto;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-text { color: #94a3b8; margin-bottom: 12px; font-size: 1rem; font-style: italic; }
        .robot-text { color: #e2e8f0; font-size: 1.25rem; font-weight: bold; line-height: 1.4; }
        #esp-simulator { font-size: 4rem; margin-top: 5px; margin-bottom: 15px; transition: 0.3s; }
        #status { color: #64748b; font-size: 0.9rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <button id="ble-btn">Połącz</button>

    <div id="orb">START</div>
    <div id="esp-simulator">😐</div>

    <div id="chat-box">
        <div id="status">Naciśnij START, aby obudzić AstroyAI</div>
        <div id="user-msg" class="user-text"></div>
        <div id="robot-msg" class="robot-text"></div>
    </div>

    <script>
        const API_KEY = ""; 
        let historiaRozmowy = [];
        let czyAIPrzetwarza = false; // Flaga blokująca usypianie podczas myślenia
        let wakeLock = null; // Blokada wygaszacza ekranu

        // ==========================================
        // WAKE LOCK - Blokowanie gaszenia ekranu
        // ==========================================
        async function wlaczWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Błąd Wake Lock: ${err.message}`);
            }
        }
        
        // Ponów blokadę, gdyby użytkownik zminimalizował aplikację i wrócił
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                wlaczWakeLock();
            }
        });

        // ==========================================
        // OBSŁUGA BLUETOOTH
        // ==========================================
        let bleCharacteristic = null;
        const bleBtn = document.getElementById('ble-btn');
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        bleBtn.addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Astroy' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                bleBtn.innerText = "Połączono";
                bleBtn.style.background = "rgba(0, 255, 136, 0.2)";
                bleBtn.style.color = "#00ff88";
                bleBtn.style.borderColor = "#00ff88";
                
                // POPRAWKA UI: Usuwamy symulator twarzy i powiększamy kulę, Flexbox resztę wyśrodkuje sam!
                document.getElementById('esp-simulator').style.display = 'none';
                document.getElementById('orb').style.transform = 'scale(1.15)';
                
                sendToESP32("IDLE"); 
            } catch (error) {
                console.log("Błąd łączenia: ", error);
            }
        });

        async function sendToESP32(emotion) {
            if (bleCharacteristic) {
                try {
                    let encoder = new TextEncoder();
                    await bleCharacteristic.writeValue(encoder.encode(emotion));
                } catch (error) {
                    console.error("Błąd wysyłania: ", error);
                }
            }
        }
        // ==========================================

        const orb = document.getElementById('orb');
        const status = document.getElementById('status');
        const userMsg = document.getElementById('user-msg');
        const robotMsg = document.getElementById('robot-msg');
        const espSimulator = document.getElementById('esp-simulator');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'pl-PL';
        recognition.interimResults = false;

        let dostepneGlosy = [];
        window.speechSynthesis.onvoiceschanged = () => {
            dostepneGlosy = window.speechSynthesis.getVoices();
        };

        // GŁÓWNY PRZYCISK (KULA)
        orb.addEventListener('click', () => {
            if (orb.innerText === "START") {
                wlaczWakeLock();
                status.style.display = 'none'; 
                simulateESP32("HAPPY");
                speakText("Cześć Maciej! Jestem gotowy. W czym mogę pomóc?");
            } else if (orb.innerText === "Zzz..." || orb.innerText === "BŁĄD") {
                // Wybudzanie
                startListening();
            } else if (orb.innerText === "Słucham...") {
                // Bezpiecznik: jeśli się zawiesi, kliknięcie usypia go ręcznie
                try { recognition.stop(); } catch(e) {}
                czyAIPrzetwarza = false;
                orb.className = '';
                orb.innerText = "Zzz...";
                sendToESP32("IDLE");
            }
        });

        function startListening() {
            czyAIPrzetwarza = false;
            orb.className = 'listening';
            orb.innerText = "Słucham...";
            sendToESP32("IDLE");
            try { recognition.start(); } catch(e) {}
        }

        recognition.onresult = (event) => {
            czyAIPrzetwarza = true; // Rozpoczęto myślenie, ignorujemy timeout mikrofonu
            const transcript = event.results[0][0].transcript;
            userMsg.innerText = "Ty: " + transcript;
            robotMsg.innerText = "";
            
            orb.className = 'thinking';
            orb.innerText = "Myślę...";
            
            askGemini(transcript); 
        };

        // NOWOŚĆ: Logika usypiania zamiast błędu
        recognition.onend = () => {
            if (!czyAIPrzetwarza) {
                // Mikrofon wyłączył się z powodu ciszy
                orb.className = '';
                orb.innerText = "Zzz...";
                sendToESP32("IDLE");
            }
        };

        recognition.onerror = (event) => {
            if (event.error !== 'no-speech') {
                console.log("Błąd rozpoznawania:", event.error);
            }
        };

        async function askGemini(text) {
            simulateESP32("THINKING");
            
            const promptSystemowy = "Jesteś biurkowym robotem Macieja o imieniu Astory, jego kumplem z kim może pogadać przy pracy, ale też któremu możesz pomóc w jakiś prostych sprawach. Twoje odpowiedzi muszą być krótkie (1-2 zdania). Na samym początku KAŻDEJ odpowiedzi ZAWSZE wstawiaj tag emocji w nawiasach kwadratowych: [HAPPY], [SAD], [ANGRY], [THINKING], [CONFUSED], [SURPRISED], [SCARED]. BARDZO WAŻNE: Używaj TYLKO czystego tekstu. Nie używaj absolutnie żadnych znaków specjalnych (gwiazdek, podkreśleń), emotikonów, ani angielskich wtrąceń, bo czyta to syntezator mowy.";

            historiaRozmowy.push({ role: "user", parts: [{ text: text }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: promptSystemowy }] },
                        contents: historiaRozmowy,
                        generationConfig: { temperature: 0.3 }
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    robotMsg.innerText = "Błąd API: " + data.error.message;
                    historiaRozmowy.pop();
                    orb.innerText = "Zzz...";
                    return;
                }

                const aiText = data.candidates[0].content.parts[0].text;
                historiaRozmowy.push({ role: "model", parts: [{ text: aiText }] });
                processAIResponse(aiText);

            } catch (error) {
                robotMsg.innerText = "Błąd sieci: " + error;
                historiaRozmowy.pop();
                orb.innerText = "Zzz...";
            }
        }

        function processAIResponse(fullText) {
            const match = fullText.match(/\[(.*?)\]/);
            let textToSpeak = fullText;

            if (match) {
                const emotion = match[1].toUpperCase();
                simulateESP32(emotion); 
                textToSpeak = fullText.replace(/\[.*?\]/g, '').trim(); 
            }

            robotMsg.innerText = textToSpeak; 
            speakText(textToSpeak);
        }

        function simulateESP32(emotion) {
            if(emotion === "HAPPY") espSimulator.innerText = "😄";
            else if(emotion === "SAD") espSimulator.innerText = "😢";
            else if(emotion === "ANGRY") espSimulator.innerText = "😡";
            else if(emotion === "THINKING") espSimulator.innerText = "🤔";
            else if(emotion === "CONFUSED") espSimulator.innerText = "😕";
            else if(emotion === "SURPRISED") espSimulator.innerText = "😲";
            else if(emotion === "SCARED") espSimulator.innerText = "😨";
            else espSimulator.innerText = "🤖"; 
            
            sendToESP32(emotion);
        }

        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 1.0; 
            
            const polskieGlosy = dostepneGlosy.filter(g => g.lang.includes('pl') || g.lang.includes('PL'));
            if (polskieGlosy.length > 0) {
                const lepszyGlos = polskieGlosy.find(g => g.name.includes('Google'));
                utterance.voice = lepszyGlos ? lepszyGlos : polskieGlosy[0];
            }
            
            utterance.onend = () => {
                startListening();
            };

            orb.className = 'speaking';
            orb.innerText = ""; 

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
