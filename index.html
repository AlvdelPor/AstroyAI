<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Oliwii</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        #orb {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #00ff88, #00b3ff);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #121212;
            margin-bottom: 20px;
        }

        #orb:active {
            transform: scale(0.95);
        }

        .listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #ff0055, #ffaa00) !important;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.6) !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Sekcja czatu i symulatora robota */
        #chat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
            min-height: 100px;
            margin-bottom: 20px;
        }

        .user-text { color: #00ff88; margin-bottom: 10px; }
        .robot-text { color: #00b3ff; }
        
        #esp-simulator {
            font-size: 3rem;
            margin-top: 10px;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <!-- Główny przycisk -->
    <div id="orb">START</div>
    
    <!-- Ekran ESP32 (Symulacja) -->
    <div id="esp-simulator">😐</div>
    <p style="font-size: 0.8rem; color: #888;">Symulator twarzy robota</p>

    <!-- Tekst rozmowy -->
    <div id="chat-box">
        <div id="status">Naciśnij START, aby obudzić robota</div>
        <div id="user-msg" class="user-text"></div>
        <div id="robot-msg" class="robot-text"></div>
    </div>

    <script>
        // ==========================================
        // TUTAJ WKLEJ SWÓJ KLUCZ API!
        const API_KEY = "TUTAJ_WKLEJ_SWOJ_KLUCZ_Z_GOOGLE_AI_STUDIO"; 
        // ==========================================

        const orb = document.getElementById('orb');
        const status = document.getElementById('status');
        const userMsg = document.getElementById('user-msg');
        const robotMsg = document.getElementById('robot-msg');
        const espSimulator = document.getElementById('esp-simulator');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'pl-PL';
        recognition.interimResults = false;

        orb.addEventListener('click', () => {
            simulateESP32("HAPPY");
            speakText("Cześć Oliwia! Jestem gotowy. O czym dzisiaj porozmawiamy?");
        });

        // Włączanie mikrofonu po tym jak robot skończy mówić
        function startListening() {
            status.innerText = "Słucham Cię...";
            orb.classList.add('listening');
            orb.innerText = "SŁUCHA";
            recognition.start();
        }

        // Reakcja na to co usłyszał mikrofon
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userMsg.innerText = "Ty: " + transcript;
            robotMsg.innerText = "";
            
            orb.classList.remove('listening');
            orb.innerText = "MYŚLI";
            status.innerText = "Wysyłam do mózgu...";
            
            askGemini(transcript); // Wysyłamy tekst do AI
        };

        recognition.onerror = (event) => {
            status.innerText = "Nie usłyszałem. Naciśnij ponownie.";
            orb.classList.remove('listening');
            orb.innerText = "BŁĄD";
        };

        // KOMUNIKACJA Z GEMINI
        async function askGemini(text) {
            simulateESP32("THINKING");
            
            const promptSystemowy = "Jesteś uroczym, małym robotem biurkowym Oliwii. Jesteś jej kumplem, czasem bywasz złośliwy dla żartu. Odpowiadaj BARDZO KRÓTKO (1-2 zdania maksymalnie), bo twój głos syntezatora męczy ucho. Na samym początku KAŻDEJ odpowiedzi ZAWSZE wstawiaj tag emocji w nawiasach kwadratowych. Dostępne tagi: [HAPPY], [SAD], [ANGRY], [THINKING].";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: promptSystemowy }] },
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    console.error("Błąd API:", data.error.message);
                    speakText("Ups, chyba nie wpisałeś poprawnego klucza API w kodzie!");
                    return;
                }

                const aiText = data.candidates[0].content.parts[0].text;
                processAIResponse(aiText);

            } catch (error) {
                console.error("Błąd sieci:", error);
                speakText("Sprawdź połączenie z internetem.");
            }
        }

        // WYCINANIE EMOCJI I GADANIE
        function processAIResponse(fullText) {
            // Szukamy tekstu w nawiasach kwadratowych, np. [HAPPY]
            const match = fullText.match(/\[(.*?)\]/);
            let textToSpeak = fullText;

            if (match) {
                const emotion = match[1].toUpperCase(); // Pobiera samo słowo HAPPY
                simulateESP32(emotion); // Wysyła do symulatora robota
                textToSpeak = fullText.replace(match[0], '').trim(); // Usuwa [HAPPY] z tekstu do czytania
            }

            robotMsg.innerText = "Robot: " + textToSpeak;
            speakText(textToSpeak);
        }

        // SYMULATOR ESP32 (W przyszłości tu zrobimy połączenie WiFi)
        function simulateESP32(emotion) {
            // W zależności od słowa-klucza z Gemini, wyświetlamy inną minkę
            if(emotion === "HAPPY") espSimulator.innerText = "😄";
            else if(emotion === "SAD") espSimulator.innerText = "😢";
            else if(emotion === "ANGRY") espSimulator.innerText = "😡";
            else if(emotion === "THINKING") espSimulator.innerText = "🤔";
            else espSimulator.innerText = "🤖"; // Domyślna minka

            console.log("WYSŁANO DO ESP32 KOMENDĘ:", emotion);
        }

        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 0.9; // Lekko zwolnione tempo, brzmi trochę lepiej
            
            utterance.onend = () => {
                startListening();
            };

            window.speechSynthesis.speak(utterance);
            orb.innerText = "GADA";
        }
    </script>
</body>
</html>
