<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroyAI</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; margin: 0; overflow: hidden; text-align: center; }
        #ble-btn { position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 10px 15px; border-radius: 10px; cursor: pointer; backdrop-filter: blur(5px); font-weight: bold; transition: 0.3s; }
        #orb { width: 150px; height: 150px; background: linear-gradient(135deg, #4285f4, #9b72cb, #ff8a65); border-radius: 50%; cursor: pointer; box-shadow: 0 0 25px rgba(155, 114, 203, 0.4); transition: transform 0.4s ease; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.1rem; color: #ffffff; text-shadow: 0px 1px 4px rgba(0,0,0,0.4); margin-bottom: 25px; }
        #orb:active { transform: scale(0.95) !important; }
        .listening { animation: organicPulse 3s infinite; background: linear-gradient(135deg, #ff758c, #ff7eb3, #9b72cb) !important; }
        .thinking { animation: organicPulse 2.5s infinite; background: linear-gradient(135deg, #00f2fe, #4facfe, #9b72cb) !important; }
        .speaking { animation: organicPulse 3.5s infinite; }
        @keyframes organicPulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(155, 114, 203, 0.4); }
            25% { transform: scale(1.06); box-shadow: 0 0 35px rgba(155, 114, 203, 0.7); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(155, 114, 203, 0.5); }
            75% { transform: scale(1.08); box-shadow: 0 0 40px rgba(155, 114, 203, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(155, 114, 203, 0.4); }
        }
        #chat-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); padding: 20px; border-radius: 20px; width: 85%; max-width: 500px; height: 120px; overflow-y: auto; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); }
        .user-text { color: #94a3b8; margin-bottom: 12px; font-size: 1rem; font-style: italic; }
        .robot-text { color: #e2e8f0; font-size: 1.25rem; font-weight: bold; line-height: 1.4; }
        #esp-simulator { font-size: 4rem; margin-top: 5px; margin-bottom: 15px; }
        #status { color: #64748b; font-size: 0.9rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <button id="ble-btn">Połącz</button>
    <div id="orb">START</div>
    <div id="esp-simulator">😐</div>
    <div id="chat-box">
        <div id="status">Naciśnij START, aby obudzić AstroyAI</div>
        <div id="user-msg" class="user-text"></div>
        <div id="robot-msg" class="robot-text"></div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6IbzTzv0o25_lU8NIzMv81-XePYvjV4aSPPu0Qje5vqkg";
        let historiaRozmowy = [];
        let czyAIPrzetwarza = false; 
        let wakeLock = null; 
        
        let trybKomendy = false; 
        let audioCtx = null; 
        let currentAbortController = null;
        let timerInterval = null; 

        function zainicjujAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function zagrajDzwiek(czestotliwosc, czas) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(czestotliwosc, audioCtx.currentTime);
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + czas);
        }

        async function wlaczWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) { console.log(`Błąd Wake Lock: ${err.message}`); }
        }
        
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') wlaczWakeLock();
        });

        let bleCharacteristic = null;
        const bleBtn = document.getElementById('ble-btn');
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        bleBtn.addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ name: 'Astroy' }], optionalServices: [SERVICE_UUID] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                bleBtn.innerText = "Połączono";
                bleBtn.style.background = "rgba(0, 255, 136, 0.2)";
                bleBtn.style.color = "#00ff88"; bleBtn.style.borderColor = "#00ff88";
                document.getElementById('esp-simulator').style.visibility = 'hidden';
                document.getElementById('orb').style.transform = 'scale(1.05) translateY(5px)';
                
                sendToESP32("IDLE"); 
            } catch (error) { console.log("Błąd łączenia: ", error); }
        });

        async function sendToESP32(emotion) {
            if (bleCharacteristic) {
                try {
                    let encoder = new TextEncoder();
                    await bleCharacteristic.writeValue(encoder.encode(emotion));
                } catch (error) {}
            }
        }

        const orb = document.getElementById('orb');
        const status = document.getElementById('status');
        const userMsg = document.getElementById('user-msg');
        const robotMsg = document.getElementById('robot-msg');
        const espSimulator = document.getElementById('esp-simulator');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'pl-PL';
        recognition.interimResults = false;

        let dostepneGlosy = [];
        window.speechSynthesis.onvoiceschanged = () => { dostepneGlosy = window.speechSynthesis.getVoices(); };

        function resetToZzz() {
            czyAIPrzetwarza = false;
            trybKomendy = false;
            orb.className = '';
            if(timerInterval) orb.innerText = "Timer";
            else orb.innerText = "Zzz...";
            if(!timerInterval) sendToESP32("IDLE"); 
        }

        orb.addEventListener('click', () => {
            zainicjujAudio(); 
            if (orb.innerText === "START") {
                wlaczWakeLock();
                status.style.display = 'none'; 
                simulateESP32("HAPPY");
                speakText("Cześć! W czym mogę pomóc?");
            } 
            else if (orb.innerText === "Zzz..." || orb.innerText === "BŁĄD") {
                startListening();
            } 
            else if (orb.innerText === "Słucham..." || orb.innerText === "Myślę..." || orb.innerText === "Komenda..." || orb.innerText === "Timer") {
                try { recognition.stop(); } catch(e) {}
                if (currentAbortController) currentAbortController.abort();
                if (timerInterval) clearInterval(timerInterval); timerInterval = null;
                
                robotMsg.innerText = "*Zresetowano na żądanie*";
                resetToZzz();
            }
        });

        function startListening() {
            czyAIPrzetwarza = false;
            trybKomendy = false;
            orb.className = 'listening';
            orb.innerText = "Słucham...";
            if(!timerInterval) sendToESP32("IDLE"); 
            try { recognition.start(); } catch(e) {}
        }

        // =====================================
        // LOGIKA MINUTNIKA W TLE
        // =====================================
        function startTimer(seconds) {
            if(timerInterval) clearInterval(timerInterval);
            trybKomendy = false;
            czyAIPrzetwarza = false;
            orb.className = '';
            orb.innerText = "Timer";
            
            // Od razu mówimy, co robimy
            let mText = Math.floor(seconds / 60);
            speakText(`Nastawiam minutnik na ${mText > 0 ? mText + ' minut' : seconds + ' sekund'}.`);

            timerInterval = setInterval(() => {
                seconds--;
                if (seconds < 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    simulateESP32("SURPRISED"); 
                    zagrajDzwiek(800, 0.5); setTimeout(() => zagrajDzwiek(1200, 1), 500);
                    robotMsg.innerText = "*Koniec czasu!*";
                    speakText("Koniec odliczania czasu!");
                    return;
                }
                let m = Math.floor(seconds / 60).toString().padStart(2, '0');
                let s = (seconds % 60).toString().padStart(2, '0');
                sendToESP32("T:" + m + ":" + s); 
                robotMsg.innerText = `*Odliczanie: ${m}:${s}*`;
            }, 1000);
        }

        recognition.onresult = (event) => {
            czyAIPrzetwarza = true; 
            const originalTranscript = event.results[0][0].transcript;
            let cleanTranscript = originalTranscript.toLowerCase().replace(/[.,!?]/g, "").trim();
            userMsg.innerText = "Ty: " + originalTranscript;

            const mapLiczb = {"jeden":1, "jedną":1, "dwa":2, "dwie":2, "trzy":3, "cztery":4, "pięć":5, "sześć":6, "siedem":7, "osiem":8, "dziewięć":9, "dziesięć":10};
            for(let slowo in mapLiczb) { cleanTranscript = cleanTranscript.replace(slowo, mapLiczb[slowo]); }

            if (trybKomendy || cleanTranscript.includes("okej robot") || cleanTranscript.includes("ok robot")) {
                
                // FUNKCJA: ZATRZYMYWANIE MINUTNIKA
                if (cleanTranscript.includes("zatrzymaj") || cleanTranscript.includes("anuluj") || cleanTranscript.includes("stop")) {
                    if(timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        robotMsg.innerText = "*Zatrzymano minutnik*";
                        speakText("Odliczanie zostało zatrzymane.");
                    } else {
                        speakText("Obecnie niczego nie odliczam.");
                    }
                    return;
                }

                // FUNKCJA: GODZINA
                if (cleanTranscript.includes("godzina") || cleanTranscript.includes("godzinę") || cleanTranscript.includes("czas")) {
                    const now = new Date();
                    const h = now.getHours().toString().padStart(2, '0');
                    const m = now.getMinutes().toString().padStart(2, '0');
                    sendToESP32("T:" + h + ":" + m);
                    robotMsg.innerText = "*Wyświetlam godzinę*";
                    speakText(`Jest godzina ${h}:${m}.`); 
                    return;
                }

                // FUNKCJA: DATA
                if (cleanTranscript.includes("dzień") || cleanTranscript.includes("data") || cleanTranscript.includes("dzisiaj")) {
                    const now = new Date();
                    const d = now.getDate().toString().padStart(2, '0');
                    const m = (now.getMonth() + 1).toString().padStart(2, '0');
                    sendToESP32("T:" + d + "." + m);
                    robotMsg.innerText = "*Wyświetlam datę*";
                    speakText(`Dzisiaj jest ${d} dzień miesiąca.`); 
                    return;
                }
                
                // FUNKCJA: POGODA (Czytanie na głos + wyświetlanie)
                if (cleanTranscript.includes("pogoda") || cleanTranscript.includes("pogodę") || cleanTranscript.includes("temperatura")) {
                    robotMsg.innerText = "*Sprawdzam chmury...*";
                    fetch('https://api.open-meteo.com/v1/forecast?latitude=51.10&longitude=17.03&current_weather=true')
                        .then(res => res.json())
                        .then(data => {
                            const temp = Math.round(data.current_weather.temperature);
                            sendToESP32("T:" + temp + "°C");
                            robotMsg.innerText = `*Aktualna temperatura: ${temp}°C*`;
                            speakText(`Aktualna temperatura na zewnątrz to ${temp} stopni.`);
                        }).catch(() => resetToZzz());
                    return;
                }

                // FUNKCJA: RZUT MONETĄ
                if (cleanTranscript.includes("monet")) {
                    const los = Math.random() > 0.5 ? "ORZEL" : "RESZKA";
                    sendToESP32("T:" + los);
                    robotMsg.innerText = `*Wynik losowania: ${los}*`;
                    speakText(`Wypadł ${los}.`);
                    return;
                }

                // FUNKCJA: MINUTNIK
                if (cleanTranscript.includes("minutnik") || cleanTranscript.includes("odliczanie") || cleanTranscript.includes("stoper")) {
                    let timeInSecs = 0;
                    let matchMin = cleanTranscript.match(/(\d+)\s*minut/);
                    let matchSec = cleanTranscript.match(/(\d+)\s*sekund/);
                    if (matchMin) timeInSecs += parseInt(matchMin[1]) * 60;
                    if (matchSec) timeInSecs += parseInt(matchSec[1]);
                    
                    if (timeInSecs === 0) timeInSecs = 60; 
                    
                    startTimer(timeInSecs);
                    return;
                }

                // EMOCJE RĘCZNE
                let emocjaESP = null;
                if (cleanTranscript.includes("radość") || cleanTranscript.includes("wesoł")) emocjaESP = "HAPPY";
                else if (cleanTranscript.includes("smutek") || cleanTranscript.includes("smutn")) emocjaESP = "SAD";
                else if (cleanTranscript.includes("złość") || cleanTranscript.includes("zły")) emocjaESP = "ANGRY";
                else if (cleanTranscript.includes("strach") || cleanTranscript.includes("bój")) emocjaESP = "SCARED";
                else if (cleanTranscript.includes("zaskoczenie") || cleanTranscript.includes("dziw")) emocjaESP = "SURPRISED";
                else if (cleanTranscript.includes("myśl")) emocjaESP = "THINKING";
                
                if (emocjaESP) {
                    simulateESP32(emocjaESP);
                    zagrajDzwiek(600, 0.2); 
                    robotMsg.innerText = "*Wysłano komendę: " + emocjaESP + "*";
                    resetToZzz();
                    return; 
                } else {
                    trybKomendy = true;
                    czyAIPrzetwarza = false;
                    zagrajDzwiek(1200, 0.1); 
                    orb.className = 'listening';
                    orb.innerText = "Komenda...";
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 500);
                    return; 
                }
            }

            // ROZMOWA Z AI (Jeśli żadna ze sztywnych komend nie pasowała)
            robotMsg.innerText = "";
            orb.className = 'thinking';
            orb.innerText = "Myślę...";
            askGemini(originalTranscript); 
        };

        // ZABEZPIECZENIE MIKROFONU (Rozwiązuje problem losowego wyłączania)
        recognition.onend = () => {
            if (trybKomendy && !czyAIPrzetwarza) {
                // Robot czekał na komendę po "Okej robot", ale nic nie usłyszał przed wyłączeniem mikrofonu
                robotMsg.innerText = "*Nie usłyszano komendy*";
                speakText("Nie usłyszałem komendy, powtórz proszę.");
            } else if (!czyAIPrzetwarza) {
                resetToZzz();
            }
        };

        recognition.onerror = (event) => {
            if (event.error !== 'no-speech') {
                console.log("Błąd rozpoznawania:", event.error);
            }
        };

        async function askGemini(text) {
            simulateESP32("THINKING");
            
            if (currentAbortController) currentAbortController.abort();
            currentAbortController = new AbortController();
            
            const timeoutId = setTimeout(() => {
                if (currentAbortController) currentAbortController.abort();
            }, 15000); 

            const promptSystemowy = "Jesteś biurkowym robotem Macieja o imieniu Astory, jego kumplem z kim może pogadać przy pracy, ale też któremu możesz pomóc w jakiś prostych sprawach. Twoje odpowiedzi muszą być krótkie (1-2 zdania). Na samym początku KAŻDEJ odpowiedzi ZAWSZE wstawiaj tag emocji w nawiasach kwadratowych: [HAPPY], [SAD], [ANGRY], [THINKING], [CONFUSED], [SURPRISED], [SCARED]. BARDZO WAŻNE: Używaj TYLKO czystego tekstu. Nie używaj absolutnie żadnych znaków specjalnych (gwiazdek, podkreśleń), emotikonów, ani angielskich wtrąceń, bo czyta to syntezator mowy.";

            historiaRozmowy.push({ role: "user", parts: [{ text: text }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    signal: currentAbortController.signal, 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: promptSystemowy }] },
                        contents: historiaRozmowy,
                        generationConfig: { temperature: 0.3 }
                    })
                });

                clearTimeout(timeoutId); 

                const data = await response.json();
                
                if(data.error) {
                    robotMsg.innerText = "Błąd API: " + data.error.message;
                    historiaRozmowy.pop();
                    resetToZzz();
                    return;
                }

                const aiText = data.candidates[0].content.parts[0].text;
                historiaRozmowy.push({ role: "model", parts: [{ text: aiText }] });
                processAIResponse(aiText);

            } catch (error) {
                if (error.name === 'AbortError') {
                    robotMsg.innerText = "*Oczekiwano zbyt długo lub przerwano.*";
                } else {
                    robotMsg.innerText = "Błąd sieci: " + error.message;
                }
                historiaRozmowy.pop(); 
                resetToZzz();
            }
        }

        function processAIResponse(fullText) {
            const match = fullText.match(/\[(.*?)\]/);
            let textToSpeak = fullText;

            if (match) {
                const emotion = match[1].toUpperCase();
                simulateESP32(emotion); 
                textToSpeak = fullText.replace(/\[.*?\]/g, '').trim(); 
            }

            robotMsg.innerText = textToSpeak; 
            speakText(textToSpeak);
        }

        function simulateESP32(emotion) {
            if(emotion === "HAPPY") espSimulator.innerText = "😄";
            else if(emotion === "SAD") espSimulator.innerText = "😢";
            else if(emotion === "ANGRY") espSimulator.innerText = "😡";
            else if(emotion === "THINKING") espSimulator.innerText = "🤔";
            else if(emotion === "CONFUSED") espSimulator.innerText = "😕";
            else if(emotion === "SURPRISED") espSimulator.innerText = "😲";
            else if(emotion === "SCARED") espSimulator.innerText = "😨";
            else espSimulator.innerText = "🤖"; 
            
            // Wysyłaj zmianę grafiki twarzy TYLKO jeśli na ekranie nie wyświetla się aktualnie odliczanie
            if(!timerInterval) sendToESP32(emotion);
        }

        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 1.0; 
            
            const polskieGlosy = dostepneGlosy.filter(g => g.lang.includes('pl') || g.lang.includes('PL'));
            if (polskieGlosy.length > 0) {
                const lepszyGlos = polskieGlosy.find(g => g.name.includes('Google'));
                utterance.voice = lepszyGlos ? lepszyGlos : polskieGlosy[0];
            }
            
            // Super ważne: funkcja odpala nasłuchiwanie dopiero GDY SKOŃCZY mówić
            utterance.onend = () => {
                // Po przeczytaniu godziny/pogody/tekstu, robot wraca do normalnego zachowania
                if(!timerInterval) sendToESP32("IDLE");
                startListening();
            };

            orb.className = 'speaking';
            orb.innerText = ""; 

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
