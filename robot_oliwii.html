<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Oliwii</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        #orb {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #00ff88, #00b3ff);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #121212;
            margin-bottom: 20px;
        }

        #orb:active {
            transform: scale(0.95);
        }

        .listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #ff0055, #ffaa00) !important;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.6) !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #chat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            min-height: 120px;
            margin-bottom: 20px;
        }

        .user-text { 
            color: #00ff88; 
            margin-bottom: 15px; 
            font-size: 1.1rem;
        }
        
        .robot-text { 
            color: #00b3ff; 
            font-size: 1.6rem; 
            font-weight: bold;
            line-height: 1.4;
        }
        
        #esp-simulator {
            font-size: 4rem;
            margin-top: 10px;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div id="orb">START</div>
    <div id="esp-simulator">😐</div>
    <p style="font-size: 0.8rem; color: #888;">Symulator twarzy robota</p>

    <div id="chat-box">
        <div id="status">Naciśnij START, aby obudzić robota</div>
        <div id="user-msg" class="user-text"></div>
        <div id="robot-msg" class="robot-text"></div>
    </div>

    <script>
        // ==========================================
        // WKLEJ SWÓJ KLUCZ PONIŻEJ
        const API_KEY = "AQ.Ab8RN6JtjsVAhQDg9_8sW19cBAJ5zXKEx80NKia7Dicpg_X0rg"; 
        // ==========================================

        const orb = document.getElementById('orb');
        const status = document.getElementById('status');
        const userMsg = document.getElementById('user-msg');
        const robotMsg = document.getElementById('robot-msg');
        const espSimulator = document.getElementById('esp-simulator');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'pl-PL';
        recognition.interimResults = false;

        orb.addEventListener('click', () => {
            simulateESP32("HAPPY");
            speakText("Cześć Oliwia! Jestem gotowy. O czym dzisiaj porozmawiamy?");
        });

        function startListening() {
            status.innerText = "Słucham Cię...";
            orb.classList.add('listening');
            orb.innerText = "SŁUCHA";
            recognition.start();
        }

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userMsg.innerText = "Ty: " + transcript;
            robotMsg.innerText = "";
            
            orb.classList.remove('listening');
            orb.innerText = "MYŚLI";
            status.innerText = "Wysyłam do mózgu...";
            
            askGemini(transcript); 
        };

        recognition.onerror = (event) => {
            status.innerText = "Nie usłyszałem. Naciśnij ponownie.";
            orb.classList.remove('listening');
            orb.innerText = "BŁĄD";
        };

        async function askGemini(text) {
            simulateESP32("THINKING");
            
            // Poprawiony prompt - prosimy o krótkie odpowiedzi, ale bez wymuszania matematycznych limitów
            const promptSystemowy = "Jesteś uroczym, małym robotem biurkowym Oliwii. Jesteś jej kumplem, odpowiadasz na luzie. Twoje odpowiedzi muszą być krótkie (1-2 zdania). Na samym początku KAŻDEJ odpowiedzi ZAWSZE wstawiaj tag emocji w nawiasach kwadratowych: [HAPPY], [SAD], [ANGRY], [THINKING]. BARDZO WAŻNE: Używaj TYLKO czystego tekstu. Nie używaj absolutnie żadnych znaków specjalnych (gwiazdek, podkreśleń), emotikonów, ani angielskich wtrąceń, bo czyta to syntezator mowy.";
            try {
                // Używamy wersji LITE, która jest najszybsza!
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: promptSystemowy }] },
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    robotMsg.innerText = "Błąd API: " + data.error.message;
                    speakText("Wystąpił błąd.");
                    return;
                }

                const aiText = data.candidates[0].content.parts[0].text;
                processAIResponse(aiText);

            } catch (error) {
                robotMsg.innerText = "Błąd sieci: " + error;
            }
        }

        function processAIResponse(fullText) {
            const match = fullText.match(/\[(.*?)\]/);
            let textToSpeak = fullText;

            if (match) {
                const emotion = match[1].toUpperCase();
                simulateESP32(emotion); 
                textToSpeak = fullText.replace(match[0], '').trim(); 
            }

            robotMsg.innerText = textToSpeak; 
            speakText(textToSpeak);
        }

        function simulateESP32(emotion) {
            if(emotion === "HAPPY") espSimulator.innerText = "😄";
            else if(emotion === "SAD") espSimulator.innerText = "😢";
            else if(emotion === "ANGRY") espSimulator.innerText = "😡";
            else if(emotion === "THINKING") espSimulator.innerText = "🤔";
            else espSimulator.innerText = "🤖"; 
        }

        // Ładowanie dostępnych głosów z telefonu
        let dostepneGlosy = [];
        window.speechSynthesis.onvoiceschanged = () => {
            dostepneGlosy = window.speechSynthesis.getVoices();
        };

        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 1.0; 
            
            // Szukamy najlepszego polskiego głosu
            const polskieGlosy = dostepneGlosy.filter(g => g.lang.includes('pl') || g.lang.includes('PL'));
            if (polskieGlosy.length > 0) {
                // Preferujemy głosy Google, bo brzmią najbardziej naturalnie
                const lepszyGlos = polskieGlosy.find(g => g.name.includes('Google'));
                utterance.voice = lepszyGlos ? lepszyGlos : polskieGlosy[0];
            }
            
            utterance.onend = () => {
                startListening();
            };

            window.speechSynthesis.speak(utterance);
            orb.innerText = "GADA";
        }
    </script>
</body>
</html>
